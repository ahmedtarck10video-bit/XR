name: Build Mixed Reality APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Setup Gradle automatically without needing local gradlew files
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      # Step 4: Generate Wrapper and Build APK
      - name: Build Debug APK
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # Step 5: Upload APK to download directly on mobile
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MixedReality-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
