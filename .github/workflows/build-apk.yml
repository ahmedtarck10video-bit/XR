steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Set up Java JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v3

  - name: Clear Gradle caches
    run: |
      echo "Clearing Gradle caches to avoid stale plugin versions"
      rm -rf ~/.gradle/caches || true
      rm -rf ~/.gradle/daemon || true
      rm -rf ~/.gradle/caches/modules-* || true

  - name: Cache Gradle state
    uses: actions/cache@v4
    with:
      path: |
        ~/.gradle/caches
        ~/.gradle/wrapper
      key: gradle-cache-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}-${{ hashFiles('**/settings.gradle.kts') }}-${{ github.sha }}
      restore-keys: gradle-cache-${{ runner.os }}-

  - name: Build Debug APK
    run: |
      chmod +x gradlew || true
      ./gradlew assembleDebug --no-daemon --no-configuration-cache --no-build-cache --refresh-dependencies --stacktrace || gradle :app:assembleDebug --no-daemon --no-configuration-cache --no-build-cache --refresh-dependencies --stacktrace

  - name: Upload Debug APK
    uses: actions/upload-artifact@v4
    with:
      name: MixedReality-APK
      path: "**/build/outputs/apk/debug/*.apk"
      if-no-files-found: error
      retention-days: 14
      
