# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings focused on this project build.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the Gradle Daemon.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Disable configuration cache to fix GitHub Actions build issues.
org.gradle.configuration-cache=false

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects.
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# Enables Gradle build caching to speed up local and CI builds.
org.gradle.caching=true

# Enables configuration on demand for multi-project builds.
org.gradle.configureondemand=true

# AndroidX package structure to make it clearer which classes are Android-specific.
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX.
android.enableJetifier=true

# Enables R8 code shrinking, optimization, and obfuscation.
android.enableR8=true

# Enable Kotlin code style for this project ("official" or "obsolete").
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and not resources declared in the library's dependencies.
android.nonTransitiveRclass=true

# Set the maximum number of workers for Gradle tasks to avoid overloading the memory.
org.gradle.workers.max=4

# Enables parallel execution of tasks across different modules.
org.gradle.vfs.watch=true

# Optimization for Kotlin incremental compilation.
kotlin.incremental=true
